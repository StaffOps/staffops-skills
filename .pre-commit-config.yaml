repos:
  - repo: local
    hooks:
      - id: validate-skills
        name: Validate skills
        entry: python3 tools/validate_skills.py
        language: system
        pass_filenames: false
        always_run: true
      - id: no-secrets
        name: Check for secrets
        entry: grep -rn "AKIA\|sk-\|ghp_\|glpat-" --include="*.md" --include="*.yaml" --include="*.json" skills/ || true
        language: system
        pass_filenames: false
