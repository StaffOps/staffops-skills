# External Secrets Operator — AWS Secrets Manager with IRSA
# SecretStore authenticates via IRSA ServiceAccount.
# ExternalSecret syncs specific keys into a K8s Secret.
---
# SecretStore — namespace-scoped, uses IRSA for authentication
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: my-namespace
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: my-service  # SA annotated with eks.amazonaws.com/role-arn
---
# ExternalSecret — pulls secrets from AWS SM into a K8s Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: my-service-secrets
  namespace: my-namespace
spec:
  refreshInterval: 1h  # How often to sync from AWS SM

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: my-service-secrets       # K8s Secret name created
    creationPolicy: Owner          # ESO owns the Secret lifecycle
    deletionPolicy: Retain         # Keep Secret if ExternalSecret is deleted

  # Map AWS Secrets Manager keys → K8s Secret data keys
  data:
    - secretKey: db-connection     # Key in the K8s Secret
      remoteRef:
        key: prod/my-service/database  # AWS SM secret name
        property: connection_string    # JSON key within the secret

    - secretKey: redis-password
      remoteRef:
        key: prod/my-service/redis
        property: password

    - secretKey: api-key
      remoteRef:
        key: prod/my-service/external-api
        # No property = entire secret value
