# VMRule Template — Recording + Alerting Rules
# Compatible with vm-operator VMRule CRD (VictoriaMetrics)
# Includes Grafana link in external.alert.source annotation

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: service-slo-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/component: vmalert
    prometheus: vmalert  # Must match VMAlert selector
spec:
  groups:
    # --- Recording Rules (precompute expensive queries) ----------------------
    - name: service.slo.recording
      interval: 30s
      rules:
        # Availability: ratio of successful requests
        - record: service:http_requests:availability5m
          expr: |
            sum(rate(http_server_request_duration_seconds_count{http_status_code!~"5.."}[5m])) by (service, namespace)
            /
            sum(rate(http_server_request_duration_seconds_count[5m])) by (service, namespace)
          labels:
            slo_type: availability

        # P99 latency by service
        - record: service:http_request_duration:p99_5m
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service, namespace)
            )
          labels:
            slo_type: latency

    # --- Alerting Rules -------------------------------------------------------
    - name: service.slo.alerts
      rules:
        - alert: HighErrorRate
          expr: |
            (1 - service:http_requests:availability5m) > 0.01
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High error rate on {{ $labels.service }}"
            description: |
              Service {{ $labels.service }} in {{ $labels.namespace }} has
              {{ $value | humanizePercentage }} error rate (>1% threshold).
            runbook_url: "https://docs.example.com/runbooks/high-error-rate"
            # Grafana link with time range — uses helmfile triple-escaping if needed
            grafana_url: "https://grafana.example.com/d/service-overview?var-service={{ $labels.service }}&var-namespace={{ $labels.namespace }}&from=now-1h&to=now"

        - alert: HighP99Latency
          expr: |
            service:http_request_duration:p99_5m > 2.0
          for: 10m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "P99 latency > 2s on {{ $labels.service }}"
            description: |
              Service {{ $labels.service }} P99 is {{ $value | humanizeDuration }}
              (threshold: 2s). Check downstream dependencies.
            runbook_url: "https://docs.example.com/runbooks/high-latency"
            grafana_url: "https://grafana.example.com/d/service-overview?var-service={{ $labels.service }}&var-namespace={{ $labels.namespace }}&from=now-1h&to=now"
