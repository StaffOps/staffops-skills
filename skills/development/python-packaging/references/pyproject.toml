[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CHANGEME"
version = "0.1.0"
description = "CHANGEME: one-line description"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "you@example.com"},
]

dependencies = [
    # Add runtime deps here with range pins
    # "httpx>=0.27,<1",
    # "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
# CLI entry point: `mycommand` runs mypackage.cli:main
# mycommand = "mypackage.cli:main"

[project.urls]
Repository = "https://gitlab.example.com/team/CHANGEME"

# ─── Tool configs ───────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
