name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Count skills
        id: count
        run: |
          SKILL_COUNT=$(find skills/ -name "SKILL.md" | wc -l)
          echo "count=$SKILL_COUNT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## staffops-skills ${{ github.ref_name }}

            **Skills in this release:** ${{ steps.count.outputs.count }}

            See CHANGELOG or auto-generated notes below for details.
