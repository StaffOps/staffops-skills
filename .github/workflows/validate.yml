name: Validate Skills
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 03:00 UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skills (test + lint)
        run: python3 tools/validate_skills.py

      - name: Generate catalog (check drift)
        run: python3 tools/generate_catalog.py

      - name: Verify metrics (dry-run on PR, live on schedule)
        run: tools/verify_metrics.sh --all
        env:
          VM_READ_ENDPOINT: ${{ secrets.VM_READ_ENDPOINT }}
        if: github.event_name == 'schedule'

      - name: Harness score (informational)
        run: npx -y harness-score . --min-level 1
        continue-on-error: true
